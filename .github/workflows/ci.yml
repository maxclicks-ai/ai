name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate skills
        run: node scripts/validate-skills.mjs

      - name: Check the skills index is up to date
        run: node scripts/build-index.mjs --check

      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/marketplace.json .claude-plugin/plugin.json gemini-extension.json .well-known/skills/index.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('ok $f')"
          done
